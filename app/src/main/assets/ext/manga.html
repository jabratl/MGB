<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Grabber - Pages</title>
<link rel="stylesheet" href="theme.css"><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:5;background:var(--panel);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s2);box-shadow:0 2px 10px #0006;border-bottom:1px solid var(--line)}
header input[type=text]{flex:1;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2) var(--s3);font:inherit}
header input[type=number],header select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s2);font:inherit}
header input[type=number]{width:80px}
button{background:var(--btn);color:var(--btnfg);border:0;border-radius:var(--r-sm);padding:var(--s2) var(--s3);cursor:pointer;font:inherit}button:hover{background:var(--btnh)}
button[hidden]{display:none!important}button:disabled{opacity:.4;cursor:default}
.r1,.r2{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.r1 .sv{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.grp{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--btn)}
.grp button{border-radius:0;background:transparent}.grp button:hover{background:var(--btnh)}.grp button+button{border-left:1px solid var(--line)}
.r2 .sp,#rb .sp{flex:1}
header .adv{margin:0}
header .adv>summary{display:flex;align-items:center;gap:var(--s2);min-height:36px;padding:var(--s1) var(--s3);list-style:none;cursor:pointer;color:var(--mut);font-weight:650;font-size:var(--fs-sm);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);width:max-content}
header .adv>summary::-webkit-details-marker{display:none}header .adv>summary::after{content:"\25BE";transition:transform .2s var(--ease)}
header .adv[open]>summary::after{transform:rotate(180deg)}
header .adv .opt{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;margin-top:var(--s2);padding:var(--s3);background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-md)}
header .adv .opt label{display:flex;align-items:center;gap:var(--s2);color:var(--mut);font-size:var(--fs-sm)}
#selbar{display:none}
#st{padding:8px 16px;color:var(--mut)}progress{width:100%;height:6px;display:block}
@media (pointer:coarse){header button,header select,header input,header .adv>summary{min-height:var(--tap)}#rb button,#rb select,#rb input[type=range],#rb label{min-height:var(--tap)}#rb button{min-width:var(--tap)}#rb label{display:inline-flex;align-items:center}}
@media (max-width:520px){header{padding:var(--s2) var(--s3)}.r1 input[type=text]{flex:1 1 100%}.r1 .sv{width:100%}.r1 .sv .grp{flex:1}.r1 .sv .grp button{flex:1}.r1 .sv #cbz,.r1 .sv #read{display:none}.r2{overflow-x:auto;flex-wrap:nowrap}.r2 button{white-space:nowrap}
#grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));padding:8px 10px calc(76px + env(safe-area-inset-bottom,0px))}
#selbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;gap:var(--s2);align-items:center;padding:var(--s2) var(--s3) calc(var(--s2) + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -6px 20px #0005}
#selbar #selc{flex:1;font-weight:650;font-size:var(--fs-md);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#selbar button{min-height:var(--tap)}
#rb{gap:var(--s2)}#rb .rg{flex:1 1 100%}#rb .sp{display:none}#rd #rb .rtop{order:-1;display:flex;width:100%;align-items:center;gap:var(--s2)}#rd #rb #rx{margin-left:auto;order:0}#rd #rb .rg{order:1}}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px 16px 60px}
.pg{position:relative;background:var(--panel);border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;min-height:120px}
.pg.sel{border-color:#4f8cff}.pg:not(.sel) img{opacity:.35}.pg.bad{border-color:#ff5370}
.pg img{display:block;width:100%}.pg .n{color:#fff;position:absolute;left:6px;top:6px;background:#000a;border-radius:10px;padding:0 7px;font-size:11px}
.pg .m{position:absolute;left:0;right:0;bottom:0;background:#000b;font-size:10px;padding:2px 6px;color:#ccc}
#rd{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}#rd.on{display:flex}
#rb{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;padding:var(--s2) var(--s3);background:#111;color:#ccc;font-size:12px}#rb .rg{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}#rb .rtop{display:contents}#rb .rg{order:1}#rb .sp{order:2}#rb #rx{order:3}#rb select{background:#1d1d1d;color:#eee;border:1px solid #333;border-radius:var(--r-sm);padding:6px}#rb button{background:#262626;color:#eee;border-radius:var(--r-sm)}#rb #rt{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rc{flex:1;overflow:auto;text-align:center;filter:brightness(var(--br,1))}#rc img{display:block;margin:0 auto}
#rc.fw img{width:calc(min(100%,var(--maxw,900px))*var(--z,1));max-width:none}#rc.fh img{max-height:calc((100vh - 44px)*var(--z,1));max-width:calc(100%*var(--z,1))}
#rc.dbl{gap:0}#rc.dbl.fw img{width:calc(min(50%,var(--maxw,900px))*var(--z,1))}#rc.dbl.fh img{max-width:calc(50%*var(--z,1))}
#rc.paged{display:flex;align-items:center;justify-content:center;overflow:auto}#rc.paged img{margin:auto}
</style></head><body>
<header>
  <div class="r1">
    <input type="text" id="ttl" placeholder="Title">
    <div class="sv"><button class="p" id="cbz" disabled>Save CBZ</button><span class="grp"><button id="zip" disabled>Save ZIP</button><button id="pdf" disabled>Save PDF</button><button id="epub" disabled>Save EPUB</button></span><button class="p" id="read" disabled>Read</button></div>
  </div>
  <div class="r2">
    <span class="grp"><button id="all">All</button><button id="none">None</button><button id="rev">Reverse</button><button id="sortn" title="Sort pages by the number in their file name">Sort by name</button></span>
    <button id="retry" hidden title="Try the failed pages again">Retry failed pages</button>
    <button id="shot" hidden title="Last resort: takes screenshots of the failed pages from the real page tab">Screenshot failed pages</button>
  </div>
  <details class="adv"><summary>Options</summary><div class="opt">
    <label>Min width <input type="number" id="minw" value="300"></label>
    <select id="post" title="Process pages when saving"><option value="none">No processing</option><option value="gray">Grayscale</option><option value="crop">Auto-crop white/black margins</option><option value="cropgray">Crop + grayscale</option><option value="split">Split tall webtoon strips</option></select>
    <select id="conv" title="Re-encode pages when saving CBZ/ZIP (smaller files)"><option value="orig">Original quality</option><option value="jpg">JPEG 85%</option><option value="webp">WebP 85%</option></select>
  </div></details>
</header>
<progress id="bar" value="0" max="1"></progress><div id="st">Loading...</div><div id="grid"></div>
<div id="selbar"><span id="selc"></span><button class="p" id="sbcbz" disabled>Save CBZ</button><button id="sbread" disabled>Read</button></div>
<div id="rd"><div id="rb"><div class="rtop"><b id="rt"></b><span class="sp"></span><button id="rx">Close (Esc)</button></div>
  <div class="rg"><label><input type="checkbox" id="rtl"> Right-to-left</label>
  <select id="mode"><option value="v">Vertical scroll</option><option value="p">Page by page</option><option value="d">Two pages</option></select>
  <select id="fit"><option value="fw">Fit width</option><option value="fh">Fit height</option></select></div>
  <div class="rg"><label title="Zoom (+ / -)">Zoom <input type="range" id="zoom" min="30" max="300" value="100" step="10" style="width:90px"> <span id="zv">100%</span></label><label title="Brightness">&#9728; <input type="range" id="bright" min="30" max="130" value="100" style="width:80px"></label></div>
  <div class="rg"><button id="bm" title="Remember this position (also saved automatically)">&#128278;</button><span id="pn"></span></div></div><div id="rc"></div></div>
<script>document.getElementById("sbcbz").onclick=function(){document.getElementById("cbz").click()};document.getElementById("sbread").onclick=function(){document.getElementById("read").click()};</script>
<script src="shared.js"></script><script src="sites.js"></script><script src="manga.js"></script></body></html>
