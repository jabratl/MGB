<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Grabber - Library</title>
<link rel="stylesheet" href="theme.css"><style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:99px;padding:8px 14px;font:inherit;font-weight:650;cursor:pointer}
.tb:hover{color:var(--fg)}
.tb.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.badge[hidden]{display:none}
.fr{flex:1;min-height:0;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;display:none}
iframe.on{display:block}
@media (max-width:520px){.brand{display:none}.tb{padding:8px 11px}.bar{padding:8px}}

/* ---- V74i: tokens, bigger tabs, bottom tab bar on phones ---- */
.ti{display:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{padding:var(--s3) var(--s4)}
.tb{min-height:var(--tap)}
@media (max-width:520px){
  .bar{order:2;border-bottom:0;border-top:1px solid var(--line);padding:var(--s1) var(--s2) calc(var(--s1) + env(safe-area-inset-bottom,0px));background:var(--panel)}
  .fr{order:1}
  .tabs{justify-content:space-between;gap:2px;overflow:visible}
  .tb{flex:1;flex-direction:column;gap:2px;position:relative;padding:var(--s2) var(--s1);border:0;background:transparent;border-radius:var(--r-sm);font-size:11px}
  .ti{display:block}
  .tb.on{background:rgba(95,139,255,.16);color:var(--accent)}
  .badge{position:absolute;top:2px;left:calc(50% + 6px)}
}
</style></head><body>
<div class="bar"><span class="brand">Media Grabber</span>
<nav class="tabs" role="tablist" id="tabs">
<button class="tb" role="tab" data-t="queue"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 20h16"/></svg>Downloads <span class="badge" id="bq" hidden></span></button>
<button class="tb" role="tab" data-t="history"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button>
<button class="tb" role="tab" data-t="follow"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Following</button>
<button class="tb" role="tab" data-t="settings"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Settings</button>
</nav></div>
<div class="fr" id="fr"></div>
<script src="shared.js"></script><script src="hub.js"></script></body></html>
