name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare signing (only if secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mgb.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/mgb.jks" >> "$GITHUB_ENV"
            echo "TASK=assembleRelease" >> "$GITHUB_ENV"
          else
            echo "TASK=assembleDebug" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle "$TASK" --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MGB-apk
          path: app/build/outputs/apk/**/*.apk
